{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Load Balancer Simulator</title>
    <link rel="stylesheet" href="{% static 'app.css' %}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
</head>
<body>
    <header>
        <h1>LLM Load Balancer Simulator</h1>
        <div class="scale-control">
            <label for="tier-select">Tier</label>
            <select id="tier-select"></select>
        </div>
        <div class="scale-control">
            <button onclick="saveConfig()">Apply</button>
        </div>
        <div class="scale-control">
            <button onclick="clearStats()">Clear data</button>
        </div>
        <div class="scale-control">
            <label>Strategies</label>
            <button id="strat-backoff" class="strat-btn" onclick="toggleStrategy('backoff')">Backoff</button>
            <span id="strategies-label" class="strategies-label"></span>
        </div>
        <div class="scale-control">
            <label>Retries</label>
            <input type="number" id="bc-retries" value="{{ backoff_max_retries }}" min="0" max="20" style="width:3.5rem" onchange="saveBackoffConfig()">
            <label>Base s</label>
            <input type="number" id="bc-base" value="{{ backoff_base_delay }}" min="0.1" max="30" step="0.1" style="width:4rem" onchange="saveBackoffConfig()">
            <label>Max s</label>
            <input type="number" id="bc-max" value="{{ backoff_max_delay }}" min="1" max="300" style="width:4rem" onchange="saveBackoffConfig()">
            <label>Jitter</label>
            <input type="checkbox" id="bc-jitter" {% if backoff_jitter %}checked{% endif %} onchange="saveBackoffConfig()">
        </div>
        <div class="scale-control">
            <label>Virtual Keys</label>
            <label>RPM/user</label>
            <input type="number" id="vk-rpm" value="50" min="1" max="10000" style="width:4rem">
            <label>TPM/user</label>
            <input type="number" id="vk-tpm" value="50000" min="1000" max="1000000" style="width:5.5rem">
            <label>Budget $</label>
            <input type="number" id="vk-budget" value="1.00" min="0.01" step="0.01" style="width:4.5rem">
            <label>Reset</label>
            <select id="vk-budget-reset">
                <option value="1h">1 h</option>
                <option value="2h">2 h</option>
                <option value="6h">6 h</option>
                <option value="24h" selected>24 h</option>
                <option value="1d">1 d</option>
                <option value="1M">1 month</option>
            </select>
            <button id="btn-assign-keys" onclick="assignVirtualKeys()">Assign</button>
            <button onclick="clearVirtualKeys()">Clear</button>
            <span id="vk-status" class="vk-status {% if has_vkeys %}vk-active{% endif %}">
                {% if has_vkeys %}keys active{% else %}not assigned{% endif %}
            </span>
        </div>
        <div class="status-dot" id="status-dot"></div>
        <button id="play-btn" class="hdr-btn" onclick="toggle()">&#9654; Play</button>
    </header>

    <div id="noisy-toolbar">
        <span id="toolbar-label">Click tiles to select users</span>
        <button id="btn-make-normal"  onclick="applyMode('normal')"   style="display:none">Normal</button>
        <button id="btn-make-noisy"   onclick="applyMode('noisy')"    style="display:none">Noisy</button>
        <button id="btn-make-spammer" onclick="applyMode('spammer')"  style="display:none">Spammer</button>
        <button id="btn-make-bursty"  onclick="applyMode('bursty')"   style="display:none">Bursty (10s)</button>
        <button id="btn-reset-modes"  onclick="resetAllModes()">Reset all modes</button>
        <button id="btn-clear-sel"    onclick="clearSelection()"      style="display:none">Clear selection</button>
    </div>

    <main>
        <div class="charts">
            <div class="chart-card">
                <div class="chart-title">Requests / Minute</div>
                <canvas id="rpm-chart"></canvas>
            </div>
            <div class="chart-card">
                <div class="chart-title">Tokens / Minute</div>
                <canvas id="tpm-chart"></canvas>
            </div>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="label">Total Requests per minute</div>
                <div class="value" id="stat-total">0</div>
            </div>
            <div class="stat-card">
                <div class="label">Errors per minute</div>
                <div class="value" id="stat-errors">0</div>
            </div>
            <div class="stat-card">
                <div class="label">Avg Latency per request</div>
                <div class="value" id="stat-latency">—</div>
            </div>
            <div class="stat-card">
                <div class="label">Error breakdown (60s)</div>
                <div id="stat-error-breakdown" class="breakdown">—</div>
            </div>
        </div>

        <div class="users" id="users-grid"></div>
    </main>

    <script>
        const TIERS = [
            { label: 'Free',   rpm:      3, tpm:      40_000 },
            { label: 'Tier 1', rpm:    500, tpm:     200_000 },
            { label: 'Tier 2', rpm:  2_000, tpm:   2_000_000 },
            { label: 'Tier 3', rpm:  5_000, tpm:   4_000_000 },
            { label: 'Tier 4', rpm: 10_000, tpm:  10_000_000 },
            { label: 'Tier 5', rpm: 30_000, tpm: 150_000_000 },
        ];

        const USER_IDS = Array.from({length: 100}, (_, i) => i + 1);

        // Per-user sliding window: {ts, latency_ms} — always last 60s so count === observed RPM
        const userWindow = {};
        USER_IDS.forEach(id => { userWindow[id] = []; });
        const USER_TILE_WINDOW_MS = 60 * 1000;

        function pruneWindow(id) {
            const cutoff = Date.now() - USER_TILE_WINDOW_MS;
            userWindow[id] = userWindow[id].filter(r => r.ts >= cutoff);
        }

        function renderUserMetrics(id) {
            pruneWindow(id);
            const entries = userWindow[id];
            const latEl = document.getElementById(`lat-${id}`);
            const rpmEl = document.getElementById(`rpm-label-${id}`);
            if (entries.length === 0) {
                latEl.textContent = '—';
                latEl.className   = 'metric-value';
                rpmEl.textContent = '— RPM';
                return;
            }
            const avgLat = Math.round(entries.reduce((s, r) => s + r.latency_ms, 0) / entries.length);
            latEl.textContent = avgLat + ' ms';
            latEl.className   = 'metric-value';
            rpmEl.textContent = entries.length + ' RPM';
        }

        const CODE_MAX = 6;
        function pushCode(userId, code, success) {
            const el = document.getElementById(`codes-${userId}`);
            if (!el) return;
            const span = document.createElement('span');
            span.className = 'code-badge ' + (success ? 'code-ok' : code === 429 ? 'code-429' : 'code-err');
            span.textContent = code;
            el.insertBefore(span, el.firstChild);
            while (el.children.length > CODE_MAX) el.removeChild(el.lastChild);
        }

        // Decay display and recompute global stats as old entries leave the window
        setInterval(() => {
            USER_IDS.forEach(renderUserMetrics);

            let total = 0, errors = 0, latSum = 0;
            const errorCounts = {};
            USER_IDS.forEach(id => {
                for (const e of userWindow[id]) {
                    total++;
                    latSum += e.latency_ms;
                    if (!e.success) {
                        errors++;
                        const key = e.error === '429'        ? 'RPM 429'
                                  : e.error === '429:tokens' ? 'TPM 429'
                                  : e.status_code === 504    ? 'Timeout'
                                  : e.status_code            ? String(e.status_code)
                                  : 'Err';
                        errorCounts[key] = (errorCounts[key] || 0) + 1;
                    }
                }
            });
            document.getElementById('stat-total').textContent = total;
            document.getElementById('stat-errors').textContent = errors;
            document.getElementById('stat-latency').textContent = total > 0 ? Math.round(latSum / total) + ' ms' : '—';
            const breakdownEl = document.getElementById('stat-error-breakdown');
            const entries = Object.entries(errorCounts).sort((a, b) => b[1] - a[1]);
            breakdownEl.innerHTML = entries.length
                ? entries.map(([k, v]) => `<span>${k}: <b>${v}</b></span>`).join('')
                : '<span>—</span>';
        }, 1000);

        let running = {{ running|yesno:"true,false" }};
        let noisyIds   = new Set({{ noisy_user_ids|safe }});
        let spammerIds = new Set({{ spammer_user_ids|safe }});
        let burstyIds  = new Set({{ bursty_user_ids|safe }});
        const burstyTimers = {};
        let activeStrategies = new Set({{ active_strategies_json|safe }});
        let selectedIds = new Set();

        function tileMode(id) {
            if (spammerIds.has(id)) return 'spammer';
            if (burstyIds.has(id))  return 'bursty';
            if (noisyIds.has(id))   return 'noisy';
            return '';
        }

        // Build tiles
        const grid = document.getElementById('users-grid');
        USER_IDS.forEach(id => {
            const div = document.createElement('div');
            const mode = tileMode(id);
            div.className = 'user-tile' + (mode ? ' ' + mode : '');
            div.id = `tile-${id}`;
            div.onclick = () => toggleSelect(id);
            div.innerHTML = `
                <div class="user-header">
                    <span class="user-name">U${id}</span>
                    <span class="mode-label noisy-lbl">NOISY</span>
                    <span class="mode-label spammer-lbl">SPAM</span>
                    <span class="mode-label bursty-lbl">BURST</span>
                    <span class="user-rpm" id="rpm-label-${id}">— RPM</span>
                </div>
                <div class="badges">
                    <span class="badge tx" id="tx-${id}">TX</span>
                    <span class="badge"   id="rx-${id}"></span>
                </div>
                <div class="user-metrics">
                    <div class="metric">
                        <span class="metric-label">Avg latency</span>
                        <span class="metric-value" id="lat-${id}">—</span>
                    </div>
                </div>
            `;
            grid.appendChild(div);
        });

        function toggleSelect(id) {
            if (selectedIds.has(id)) selectedIds.delete(id);
            else selectedIds.add(id);
            document.getElementById(`tile-${id}`).classList.toggle('selected', selectedIds.has(id));
            updateToolbar();
        }

        function clearSelection() {
            selectedIds.forEach(id => document.getElementById(`tile-${id}`).classList.remove('selected'));
            selectedIds.clear();
            updateToolbar();
        }

        function updateToolbar() {
            const n = selectedIds.size;
            document.getElementById('toolbar-label').textContent =
                n > 0 ? `${n} user${n > 1 ? 's' : ''} selected` : 'Click tiles to select users';
            ['btn-make-normal','btn-make-noisy','btn-make-spammer','btn-make-bursty','btn-clear-sel']
                .forEach(id => { document.getElementById(id).style.display = n > 0 ? '' : 'none'; });
        }

        function applyUserModes(data) {
            noisyIds   = new Set(data.noisy);
            spammerIds = new Set(data.spammer);
            // Clear existing bursty timers
            burstyIds.forEach(id => clearTimeout(burstyTimers[id]));
            burstyIds = new Set(data.bursty);
            USER_IDS.forEach(id => {
                const tile = document.getElementById(`tile-${id}`);
                tile.classList.remove('noisy', 'spammer', 'bursty');
                const mode = tileMode(id);
                if (mode) tile.classList.add(mode);
            });
            // Auto-expire bursty tiles after 10s
            data.bursty.forEach(id => {
                clearTimeout(burstyTimers[id]);
                burstyTimers[id] = setTimeout(() => {
                    burstyIds.delete(id);
                    document.getElementById(`tile-${id}`)?.classList.remove('bursty');
                }, 10000);
            });
        }

        const MODE_ENDPOINTS = { normal: '/normal/', noisy: '/noisy/', spammer: '/spammer/', bursty: '/bursty/' };

        async function applyMode(mode) {
            // For noisy/spammer: replace the existing set with selected + existing of same mode
            // For normal/bursty: just apply to selected users
            let ids = [...selectedIds];
            if (mode === 'noisy')   ids = [...new Set([...ids, ...noisyIds])];
            if (mode === 'spammer') ids = [...new Set([...ids, ...spammerIds])];
            await fetch(MODE_ENDPOINTS[mode], {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_ids: ids }),
            });
            clearSelection();
        }

        async function resetAllModes() {
            await fetch('/reset-modes/', { method: 'POST', headers: { 'Content-Type': 'application/json' } });
        }

        function flash(el, colorClass, text) {
            el.textContent = text;
            el.className = `badge ${colorClass}`;
            void el.offsetWidth;
            el.classList.add('flash');
        }

        function setRunning(val) {
            running = val;
            const btn = document.getElementById('play-btn');
            const dot = document.getElementById('status-dot');
            btn.textContent = val ? '⏸ Pause' : '▶ Play';
            btn.classList.toggle('running', val);
            dot.classList.toggle('running', val);
        }

        function buildTierSelect() {
            const sel = document.getElementById('tier-select');
            const currentRpm = {{ rpm_limit }};
            const currentTpm = {{ tpm_limit }};
            TIERS.forEach((t, i) => {
                const opt = document.createElement('option');
                opt.value = i;
                opt.textContent = `${t.label} — ${t.rpm.toLocaleString()} RPM / ${t.tpm.toLocaleString()} TPM`;
                if (t.rpm === currentRpm && t.tpm === currentTpm) opt.selected = true;
                sel.appendChild(opt);
            });
        }

async function saveConfig() {
            const tier = TIERS[parseInt(document.getElementById('tier-select').value, 10)];
            await fetch('/config/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ rpm_limit: tier.rpm, tpm_limit: tier.tpm }),
            });
            currentRpmLimit = tier.rpm;
            currentTpmLimit = tier.tpm;
        }

        async function saveBackoffConfig() {
            await fetch('/backoff-config/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    max_retries: parseInt(document.getElementById('bc-retries').value, 10),
                    base_delay:  parseFloat(document.getElementById('bc-base').value),
                    max_delay:   parseFloat(document.getElementById('bc-max').value),
                    jitter:      document.getElementById('bc-jitter').checked,
                }),
            });
        }

        async function clearStats() {
            await fetch('/clear/', { method: 'POST', headers: { 'Content-Type': 'application/json' } });
            USER_IDS.forEach(id => {
                userWindow[id] = [];
                const codes = document.getElementById(`codes-${id}`);
                if (codes) codes.innerHTML = '';
            });
            eventLog = [];
            rpmChartData = []; tpmChartData = [];
            rpmUsedData  = []; tpmUsedData  = [];
            latestRpmRemaining = null; latestTpmRemaining = null;
            rpmChart.data.datasets[0].data = rpmChartData;
            tpmChart.data.datasets[0].data = tpmChartData;
            rpmChart.data.datasets[1].data = [];
            tpmChart.data.datasets[1].data = [];
            rpmChart.data.datasets[2].data = rpmUsedData;
            tpmChart.data.datasets[2].data = tpmUsedData;
            rpmChart.update('none'); tpmChart.update('none');
        }

        // ── Charts ────────────────────────────────────────────────────────────
        const CHART_WINDOW_MS = 3 * 60 * 1000;   // how far back the chart shows
        const RATE_WINDOW_MS  = 15 * 1000;        // short window; counts normalized to per-minute
        const SAMPLE_INTERVAL_MS = 500;
        let currentRpmLimit = {{ rpm_limit }};
        let currentTpmLimit = {{ tpm_limit }};
        let rpmChartData = [];
        let tpmChartData = [];
        let rpmUsedData  = [];
        let tpmUsedData  = [];
        let latestRpmRemaining = null;
        let latestTpmRemaining = null;
        // Raw event log: {ts, tokens} — pruned to RATE_WINDOW_MS; counts normalized to per-minute
        let eventLog = [];

        function buildChart(canvasId, data, label) {
            const ctx = document.getElementById(canvasId).getContext('2d');
            return new Chart(ctx, {
                type: 'line',
                data: {
                    datasets: [
                        {
                            label,
                            data,
                            borderColor: '#38bdf8',
                            backgroundColor: 'rgba(56,189,248,0.08)',
                            fill: true,
                            tension: 0.3,
                            pointRadius: 0,
                            borderWidth: 2,
                        },
                        {
                            label: 'Limit',
                            data: [],
                            borderColor: '#f87171',
                            borderDash: [6, 3],
                            pointRadius: 0,
                            borderWidth: 1.5,
                            fill: false,
                        },
                        {
                            label: 'RL Window',
                            data: [],
                            borderColor: '#fb923c',
                            backgroundColor: 'transparent',
                            fill: false,
                            tension: 0.3,
                            pointRadius: 0,
                            borderWidth: 2,
                        },
                    ],
                },
                options: {
                    animation: false,
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: {
                            type: 'linear',
                            ticks: {
                                maxTicksLimit: 6,
                                color: '#64748b',
                                callback: val => {
                                    const s = Math.round((Date.now() - val) / 1000);
                                    return s <= 2 ? 'now' : `-${s}s`;
                                },
                            },
                            grid: { color: '#1e293b' },
                        },
                        y: {
                            beginAtZero: true,
                            ticks: { color: '#64748b' },
                            grid: { color: '#334155' },
                        },
                    },
                },
            });
        }

        const rpmChart = buildChart('rpm-chart', rpmChartData, 'RPM Usage');
        const tpmChart = buildChart('tpm-chart', tpmChartData, 'TPM Usage');

        function sampleRateLimits() {
            const now = Date.now();
            const chartCutoff = now - CHART_WINDOW_MS;
            const rateCutoff  = now - RATE_WINDOW_MS;

            // Prune event log to rate window
            eventLog = eventLog.filter(e => e.ts >= rateCutoff);

            // Compute current usage in the rate window
            const rpm = eventLog.length * (60000 / RATE_WINDOW_MS);
            const tpm = eventLog.reduce((s, e) => s + e.tokens, 0) * (60000 / RATE_WINDOW_MS);

            rpmChartData.push({ x: now, y: rpm });
            tpmChartData.push({ x: now, y: tpm });
            rpmChartData = rpmChartData.filter(p => p.x >= chartCutoff);
            tpmChartData = tpmChartData.filter(p => p.x >= chartCutoff);

            // RL-window used: limit minus remaining, from the vLLM's own sliding window headers
            if (latestRpmRemaining !== null) {
                rpmUsedData.push({ x: now, y: currentRpmLimit - latestRpmRemaining });
                rpmUsedData = rpmUsedData.filter(p => p.x >= chartCutoff);
            }
            if (latestTpmRemaining !== null) {
                tpmUsedData.push({ x: now, y: currentTpmLimit - latestTpmRemaining });
                tpmUsedData = tpmUsedData.filter(p => p.x >= chartCutoff);
            }

            rpmChart.data.datasets[0].data = rpmChartData;
            tpmChart.data.datasets[0].data = tpmChartData;
            rpmChart.data.datasets[1].data = [{ x: chartCutoff, y: currentRpmLimit }, { x: now, y: currentRpmLimit }];
            tpmChart.data.datasets[1].data = [{ x: chartCutoff, y: currentTpmLimit }, { x: now, y: currentTpmLimit }];
            rpmChart.data.datasets[2].data = rpmUsedData;
            tpmChart.data.datasets[2].data = tpmUsedData;
            rpmChart.options.scales.x.min = chartCutoff;
            rpmChart.options.scales.x.max = now;
            tpmChart.options.scales.x.min = chartCutoff;
            tpmChart.options.scales.x.max = now;
            rpmChart.update('none');
            tpmChart.update('none');
        }

        setInterval(sampleRateLimits, SAMPLE_INTERVAL_MS);
        // ── End Charts ────────────────────────────────────────────────────────

        buildTierSelect();

        async function toggle() {
            const btn = document.getElementById('play-btn');
            btn.disabled = true;
            try {
                const resp = await fetch('/control/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: running ? 'stop' : 'start' }),
                });
                setRunning((await resp.json()).running);
            } finally {
                btn.disabled = false;
            }
        }

        function onResult(d) {
            // Feed chart event log (all attempts count for RPM; tokens only on success)
            // input_tokens is pre-counted before the request, so 429s still carry real token usage
            eventLog.push({ ts: Date.now(), tokens: d.input_tokens + (d.success ? d.output_tokens : 0) });

            // Track the vLLM's own remaining counters for the orange RL-window line
            if (d.rpm_remaining >= 0) latestRpmRemaining = d.rpm_remaining;
            if (d.tpm_remaining >= 0) latestTpmRemaining = d.tpm_remaining;

            // Feed sliding window — includes error type for breakdown stats
            userWindow[d.user_id].push({ ts: Date.now(), latency_ms: d.latency_ms, success: d.success, error: d.error, status_code: d.status_code });
            renderUserMetrics(d.user_id);

            // RX badge
            const is429rpm = !d.success && d.error === '429';
            const is429tpm = !d.success && d.error === '429:tokens';
            const rx = document.getElementById(`rx-${d.user_id}`);
            if      (d.success)     flash(rx, 'ok',   d.status_code || '200');
            else if (is429rpm)      flash(rx, 'r429', 'RPM');
            else if (is429tpm)      flash(rx, 'r429', 'TPM');
            else if (d.status_code) flash(rx, 'err',  d.status_code);
            else                    flash(rx, 'err',  'ERR');
        }

        function connectWS() {
            const ws = new WebSocket(`ws://${location.host}/ws/simulator/`);
            ws.onmessage = (e) => {
                const msg = JSON.parse(e.data);
                if (msg.type === 'status')        setRunning(msg.data.running);
                if (msg.type === 'request_start') flash(document.getElementById(`tx-${msg.data.user_id}`), 'tx', 'TX');
                if (msg.type === 'result')        onResult(msg.data);
                if (msg.type === 'user_modes')    applyUserModes(msg.data);
                if (msg.type === 'strategies')    applyStrategies(msg.data.active_strategies);
            };
            ws.onclose = () => setTimeout(connectWS, 2000);
        }

        function applyStrategies(strategies) {
            activeStrategies = new Set(strategies);
            document.querySelectorAll('.strat-btn').forEach(btn => {
                const name = btn.id.replace('strat-', '');
                btn.classList.toggle('active', activeStrategies.has(name));
            });
            const label = document.getElementById('strategies-label');
            label.textContent = activeStrategies.size > 0
                ? '● ' + [...activeStrategies].join(', ')
                : '';
        }

        async function toggleStrategy(name) {
            if (activeStrategies.has(name)) activeStrategies.delete(name);
            else activeStrategies.add(name);
            applyStrategies([...activeStrategies]);   // immediate visual feedback
            await fetch('/strategies/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ strategies: [...activeStrategies] }),
            });
        }

        let vkeysActive = {{ has_vkeys|yesno:"true,false" }};

        function _setVkState(active) {
            vkeysActive = active;
            const btn = document.getElementById('btn-assign-keys');
            btn.textContent = active ? 'Update' : 'Assign';
        }

        async function assignVirtualKeys() {
            const btn = document.getElementById('btn-assign-keys');
            const statusEl = document.getElementById('vk-status');
            btn.disabled = true;
            const rpm    = parseInt(document.getElementById('vk-rpm').value, 10);
            const tpm    = parseInt(document.getElementById('vk-tpm').value, 10);
            const budget = parseFloat(document.getElementById('vk-budget').value);
            const reset  = document.getElementById('vk-budget-reset').value;
            const url = vkeysActive ? '/virtual-keys/update/' : '/virtual-keys/';
            statusEl.textContent = vkeysActive ? 'updating…' : 'creating…';
            statusEl.className = 'vk-status';
            try {
                const resp = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ rpm_per_user: rpm, tpm_per_user: tpm, budget_limit: budget, budget_reset: reset }),
                });
                const data = await resp.json();
                const count  = data.created ?? data.updated;
                const nFail  = (data.failed ?? []).length;
                if (nFail === 0) {
                    statusEl.textContent = `${count} keys active`;
                    statusEl.className = 'vk-status vk-active';
                    _setVkState(true);
                } else {
                    statusEl.textContent = `${count} ok, ${nFail} failed`;
                    statusEl.className = 'vk-status vk-error';
                }
            } catch {
                statusEl.textContent = 'error';
                statusEl.className = 'vk-status vk-error';
            } finally {
                btn.disabled = false;
            }
        }

        async function clearVirtualKeys() {
            const statusEl = document.getElementById('vk-status');
            await fetch('/virtual-keys/clear/', { method: 'POST', headers: { 'Content-Type': 'application/json' } });
            statusEl.textContent = 'not assigned';
            statusEl.className = 'vk-status';
            _setVkState(false);
        }

        _setVkState(vkeysActive);

        applyStrategies([...activeStrategies]);
        setRunning(running);
        connectWS();
    </script>
</body>
</html>
