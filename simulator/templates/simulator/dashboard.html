<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Load Balancer Simulator</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
        header { background: #1e293b; border-bottom: 1px solid #334155; padding: 1rem 2rem; display: flex; align-items: center; gap: 1rem; }
        header h1 { font-size: 1.25rem; font-weight: 600; flex: 1; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #475569; }
        .status-dot.running { background: #4ade80; box-shadow: 0 0 6px #4ade80; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        #play-btn {
            display: flex; align-items: center; gap: 0.5rem;
            padding: 0.5rem 1.25rem; border-radius: 0.5rem; border: none;
            font-size: 0.875rem; font-weight: 600; cursor: pointer;
            background: #22c55e; color: #fff; transition: background 0.15s;
        }
        #play-btn:hover { background: #16a34a; }
        #play-btn.running { background: #f59e0b; }
        #play-btn.running:hover { background: #d97706; }
        #play-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        main { padding: 2rem; display: grid; gap: 1.5rem; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1rem; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 0.75rem; padding: 1.25rem; }
        .card .label { font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem; }
        .card .value { font-size: 2rem; font-weight: 700; color: #f1f5f9; }
        .card .sub { font-size: 0.8rem; color: #64748b; margin-top: 0.25rem; }
        .section-title { font-size: 0.875rem; font-weight: 600; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.75rem; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; font-size: 0.75rem; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em; padding: 0.5rem 1rem; border-bottom: 1px solid #334155; }
        td { padding: 0.65rem 1rem; border-bottom: 1px solid #1e293b; font-size: 0.875rem; font-family: monospace; }
        tr:last-child td { border-bottom: none; }
        .ok { color: #4ade80; }
        .err { color: #f87171; }
        .empty-row td { color: #475569; font-size: 0.875rem; text-align: center; font-family: system-ui; }
    </style>
</head>
<body>
    <header>
        <h1>LLM Load Balancer Simulator</h1>
        <div class="status-dot" id="status-dot"></div>
        <button id="play-btn" onclick="toggle()">&#9654; Play</button>
    </header>
    <main>
        <div class="stats">
            <div class="card">
                <div class="label">Total Requests</div>
                <div class="value" id="stat-total">0</div>
                <div class="sub">since start</div>
            </div>
            <div class="card">
                <div class="label">Errors</div>
                <div class="value" id="stat-errors">0</div>
                <div class="sub">failed requests</div>
            </div>
            <div class="card">
                <div class="label">Avg Latency</div>
                <div class="value" id="stat-latency">—</div>
                <div class="sub">ms per request</div>
            </div>
            <div class="card">
                <div class="label">Error Rate</div>
                <div class="value" id="stat-error-rate">—</div>
                <div class="sub">% of requests</div>
            </div>
        </div>

        <div class="card">
            <div class="section-title">Recent Requests</div>
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Latency</th>
                        <th>Input tokens</th>
                        <th>Output tokens</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="results-body">
                    <tr class="empty-row"><td colspan="5">No requests yet — press Play to start.</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <script>
        let running = {{ running|yesno:"true,false" }};
        const MAX_ROWS = 50;

        function setRunning(val) {
            running = val;
            const btn = document.getElementById('play-btn');
            const dot = document.getElementById('status-dot');
            if (val) {
                btn.textContent = '⏸ Pause';
                btn.classList.add('running');
                dot.classList.add('running');
            } else {
                btn.textContent = '▶ Play';
                btn.classList.remove('running');
                dot.classList.remove('running');
            }
        }

        async function toggle() {
            const btn = document.getElementById('play-btn');
            btn.disabled = true;
            try {
                const resp = await fetch('/control/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: running ? 'stop' : 'start' }),
                });
                const data = await resp.json();
                setRunning(data.running);
            } finally {
                btn.disabled = false;
            }
        }

        function onResult(d) {
            document.getElementById('stat-total').textContent = d.total;
            document.getElementById('stat-errors').textContent = d.errors;
            document.getElementById('stat-latency').textContent = d.avg_latency_ms;
            const rate = d.total > 0 ? ((d.errors / d.total) * 100).toFixed(1) : '—';
            document.getElementById('stat-error-rate').textContent = rate === '—' ? '—' : rate + '%';

            const tbody = document.getElementById('results-body');
            // Remove empty-state row
            const empty = tbody.querySelector('.empty-row');
            if (empty) empty.remove();

            const tr = document.createElement('tr');
            const statusCell = d.success
                ? `<td class="ok">OK</td>`
                : `<td class="err">${d.error || 'error'}</td>`;
            tr.innerHTML = `
                <td>${d.total}</td>
                <td>${d.latency_ms} ms</td>
                <td>${d.input_tokens || '—'}</td>
                <td>${d.output_tokens || '—'}</td>
                ${statusCell}
            `;
            tbody.insertBefore(tr, tbody.firstChild);

            // Trim old rows
            while (tbody.rows.length > MAX_ROWS) {
                tbody.deleteRow(tbody.rows.length - 1);
            }
        }

        function connectSSE() {
            const es = new EventSource('/events/');
            es.onmessage = (e) => {
                const msg = JSON.parse(e.data);
                if (msg.type === 'status') setRunning(msg.data.running);
                if (msg.type === 'result') onResult(msg.data);
            };
            es.onerror = () => {
                es.close();
                setTimeout(connectSSE, 2000);
            };
        }

        setRunning(running);
        connectSSE();
    </script>
</body>
</html>
