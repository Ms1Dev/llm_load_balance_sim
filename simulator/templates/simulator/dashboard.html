{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Load Balancer Simulator</title>
    <link rel="stylesheet" href="{% static 'app.css' %}">
</head>
<body>
    <header>
        <h1>LLM Load Balancer Simulator</h1>
        <div class="scale-control">
            <label for="tier-select">Tier</label>
            <select id="tier-select"></select>
        </div>
        <div class="scale-control">
            <button onclick="saveConfig()">Apply</button>
        </div>
        <div class="scale-control">
            <button onclick="clearStats()">Clear data</button>
        </div>
        <div class="status-dot" id="status-dot"></div>
        <button id="play-btn" class="hdr-btn" onclick="toggle()">&#9654; Play</button>
    </header>

    <div id="noisy-toolbar">
        <span id="toolbar-label">Click tiles to select users</span>
        <button id="btn-make-noisy" onclick="applyNoisy()" style="display:none">Make noisy</button>
        <button id="btn-reset-noisy" onclick="resetNoisy()">Reset all</button>
        <button id="btn-clear-sel" onclick="clearSelection()" style="display:none">Clear selection</button>
    </div>

    <main>
        <div class="stats">
            <div class="stat-card">
                <div class="label">Total Requests</div>
                <div class="value" id="stat-total">0</div>
            </div>
            <div class="stat-card">
                <div class="label">Errors</div>
                <div class="value" id="stat-errors">0</div>
            </div>
            <div class="stat-card">
                <div class="label">Avg Latency</div>
                <div class="value" id="stat-latency">—</div>
            </div>
            <div class="stat-card">
                <div class="label">Error Rate</div>
                <div class="value" id="stat-error-rate">—</div>
            </div>
        </div>

        <div class="users" id="users-grid"></div>
    </main>

    <script>
        const TIERS = [
            { label: 'Free',   rpm:      3, tpm:      40_000 },
            { label: 'Tier 1', rpm:    500, tpm:     200_000 },
            { label: 'Tier 2', rpm:  2_000, tpm:   2_000_000 },
            { label: 'Tier 3', rpm:  5_000, tpm:   4_000_000 },
            { label: 'Tier 4', rpm: 10_000, tpm:  10_000_000 },
            { label: 'Tier 5', rpm: 30_000, tpm: 150_000_000 },
        ];

        const USER_IDS = Array.from({length: 100}, (_, i) => i + 1);
        const BASELINE_RPM = 10;
        const NOISY_RPM = 40;

        // Per-user sliding window: stores {ts, latency_ms, is429} entries
        const userWindow = {};
        USER_IDS.forEach(id => { userWindow[id] = []; });

        const STATS_WINDOW_MS = {{ stats_window_minutes }} * 60 * 1000;

        function windowMs() {
            return STATS_WINDOW_MS;
        }

        function pruneWindow(id) {
            const cutoff = Date.now() - windowMs();
            userWindow[id] = userWindow[id].filter(r => r.ts >= cutoff);
        }

        function renderUserMetrics(id) {
            pruneWindow(id);
            const entries = userWindow[id];
            const latEl     = document.getElementById(`lat-${id}`);
            const r429rpmEl = document.getElementById(`r429rpm-${id}`);
            const r429tpmEl = document.getElementById(`r429tpm-${id}`);
            if (entries.length === 0) {
                latEl.textContent = r429rpmEl.textContent = r429tpmEl.textContent = '—';
                latEl.className = r429rpmEl.className = r429tpmEl.className = 'metric-value';
                return;
            }
            const avgLat  = Math.round(entries.reduce((s, r) => s + r.latency_ms, 0) / entries.length);
            const pctRpm  = Math.round(entries.filter(r => r.is429rpm).length / entries.length * 100);
            const pctTpm  = Math.round(entries.filter(r => r.is429tpm).length / entries.length * 100);

            latEl.textContent = avgLat + ' ms';
            latEl.className   = 'metric-value';

            r429rpmEl.textContent = pctRpm + '%';
            r429rpmEl.className   = 'metric-value' + (pctRpm >= 30 ? ' high-429' : pctRpm > 0 ? ' mid-429' : '');

            r429tpmEl.textContent = pctTpm + '%';
            r429tpmEl.className   = 'metric-value' + (pctTpm >= 30 ? ' high-429' : pctTpm > 0 ? ' mid-429' : '');
        }

        // Decay display as old entries leave the window
        setInterval(() => { USER_IDS.forEach(renderUserMetrics); }, 1000);

        let running = {{ running|yesno:"true,false" }};
        let noisyIds = new Set({{ noisy_user_ids|default:"[]" }});
        let selectedIds = new Set();

        // Build tiles
        const grid = document.getElementById('users-grid');
        USER_IDS.forEach(id => {
            const div = document.createElement('div');
            div.className = 'user-tile' + (noisyIds.has(id) ? ' noisy' : '');
            div.id = `tile-${id}`;
            div.onclick = () => toggleSelect(id);
            div.innerHTML = `
                <div class="user-header">
                    <span class="user-name">U${id}</span>
                    <span class="noisy-label">NOISY</span>
                    <span class="user-rpm" id="rpm-label-${id}">${noisyIds.has(id) ? NOISY_RPM : BASELINE_RPM} RPM</span>
                </div>
                <div class="badges">
                    <span class="badge tx" id="tx-${id}">TX</span>
                    <span class="badge"   id="rx-${id}"></span>
                </div>
                <div class="user-metrics">
                    <div class="metric">
                        <span class="metric-label">Avg latency</span>
                        <span class="metric-value" id="lat-${id}">—</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">429 RPM</span>
                        <span class="metric-value" id="r429rpm-${id}">—</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">429 TPM</span>
                        <span class="metric-value" id="r429tpm-${id}">—</span>
                    </div>
                </div>
            `;
            grid.appendChild(div);
        });

        function toggleSelect(id) {
            if (selectedIds.has(id)) selectedIds.delete(id);
            else selectedIds.add(id);
            document.getElementById(`tile-${id}`).classList.toggle('selected', selectedIds.has(id));
            updateToolbar();
        }

        function clearSelection() {
            selectedIds.forEach(id => document.getElementById(`tile-${id}`).classList.remove('selected'));
            selectedIds.clear();
            updateToolbar();
        }

        function updateToolbar() {
            const n = selectedIds.size;
            document.getElementById('toolbar-label').textContent =
                n > 0 ? `${n} user${n > 1 ? 's' : ''} selected` : 'Click tiles to select users';
            document.getElementById('btn-make-noisy').style.display = n > 0 ? '' : 'none';
            document.getElementById('btn-clear-sel').style.display  = n > 0 ? '' : 'none';
        }

        function applyNoisyIds(ids) {
            noisyIds = new Set(ids);
            USER_IDS.forEach(id => {
                const tile = document.getElementById(`tile-${id}`);
                const isNoisy = noisyIds.has(id);
                tile.classList.toggle('noisy', isNoisy);
                document.getElementById(`rpm-label-${id}`).textContent =
                    (isNoisy ? NOISY_RPM : BASELINE_RPM) + ' RPM';
            });
        }

        async function applyNoisy() {
            const ids = [...selectedIds, ...noisyIds]; // add to existing noisy set
            const unique = [...new Set(ids)];
            await fetch('/noisy/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_ids: unique }),
            });
            clearSelection();
        }

        async function resetNoisy() {
            await fetch('/noisy/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_ids: [] }),
            });
        }

        function flash(el, colorClass, text) {
            el.textContent = text;
            el.className = `badge ${colorClass}`;
            void el.offsetWidth;
            el.classList.add('flash');
        }

        function setRunning(val) {
            running = val;
            const btn = document.getElementById('play-btn');
            const dot = document.getElementById('status-dot');
            btn.textContent = val ? '⏸ Pause' : '▶ Play';
            btn.classList.toggle('running', val);
            dot.classList.toggle('running', val);
        }

        function buildTierSelect() {
            const sel = document.getElementById('tier-select');
            const currentRpm = {{ rpm_limit }};
            const currentTpm = {{ tpm_limit }};
            TIERS.forEach((t, i) => {
                const opt = document.createElement('option');
                opt.value = i;
                opt.textContent = `${t.label} — ${t.rpm.toLocaleString()} RPM / ${t.tpm.toLocaleString()} TPM`;
                if (t.rpm === currentRpm && t.tpm === currentTpm) opt.selected = true;
                sel.appendChild(opt);
            });
        }

async function saveConfig() {
            const tier = TIERS[parseInt(document.getElementById('tier-select').value, 10)];
            await fetch('/config/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ rpm_limit: tier.rpm, tpm_limit: tier.tpm }),
            });
        }

        async function clearStats() {
            await fetch('/clear/', { method: 'POST', headers: { 'Content-Type': 'application/json' } });
            USER_IDS.forEach(id => { userWindow[id] = []; renderUserMetrics(id); });
            ['stat-total', 'stat-errors'].forEach(id => document.getElementById(id).textContent = '0');
            document.getElementById('stat-latency').textContent = '—';
            document.getElementById('stat-error-rate').textContent = '—';
        }

        buildTierSelect();

        async function toggle() {
            const btn = document.getElementById('play-btn');
            btn.disabled = true;
            try {
                const resp = await fetch('/control/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: running ? 'stop' : 'start' }),
                });
                setRunning((await resp.json()).running);
            } finally {
                btn.disabled = false;
            }
        }

        function onResult(d) {
            // Global stats
            document.getElementById('stat-total').textContent = d.total;
            document.getElementById('stat-errors').textContent = d.errors;
            document.getElementById('stat-latency').textContent = d.avg_latency_ms + ' ms';
            const rate = d.total > 0 ? ((d.errors / d.total) * 100).toFixed(1) + '%' : '—';
            document.getElementById('stat-error-rate').textContent = rate;

            // Feed sliding window
            const is429rpm = !d.success && d.error === '429';
            const is429tpm = !d.success && d.error === '429:tokens';
            userWindow[d.user_id].push({ ts: Date.now(), latency_ms: d.latency_ms, is429rpm, is429tpm });
            renderUserMetrics(d.user_id);

            // RX badge
            const rx = document.getElementById(`rx-${d.user_id}`);
            if (d.success)      flash(rx, 'ok',   d.status_code || '200');
            else if (is429rpm)  flash(rx, 'r429', 'RPM');
            else if (is429tpm)  flash(rx, 'r429', 'TPM');
            else                flash(rx, 'err',  d.status_code || 'ERR');
        }

        function connectWS() {
            const ws = new WebSocket(`ws://${location.host}/ws/simulator/`);
            ws.onmessage = (e) => {
                const msg = JSON.parse(e.data);
                if (msg.type === 'status')        setRunning(msg.data.running);
                if (msg.type === 'request_start') flash(document.getElementById(`tx-${msg.data.user_id}`), 'tx', 'TX');
                if (msg.type === 'result')        onResult(msg.data);
                if (msg.type === 'noisy_users')   applyNoisyIds(msg.data.noisy_user_ids);
            };
            ws.onclose = () => setTimeout(connectWS, 2000);
        }

        setRunning(running);
        connectWS();
    </script>
</body>
</html>
