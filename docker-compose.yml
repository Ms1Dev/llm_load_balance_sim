services:
  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: demo
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: sh -c "python manage.py migrate --no-input && python manage.py collectstatic --no-input && watchfiles --filter python 'daphne -b 0.0.0.0 -p 8000 config.asgi:application'"
    cpu_shares: 512        # runner is the load generator — lower priority than backend
    env_file:
      - .env
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DEBUG: "true"
      DATABASE_NAME: demo
      DATABASE_USER: demo
      DATABASE_PASSWORD: demo
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      REDIS_URL: redis://redis:6379
      OPENAI_BASE_URL: http://backend:8003/v1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      backend:
        condition: service_started

  backend:
    build: ./backend
    cpu_shares: 1024       # system under test — wins CPU contention against the runner
    ports:
      - "8003:8003"
    volumes:
      - ./backend:/app
    environment:
      BIFROST_URL: http://bifrost:8080/v1
      REDIS_URL: redis://redis:6379
    depends_on:
      bifrost:
        condition: service_started
      redis:
        condition: service_started

  bifrost:
    image: maximhq/bifrost:v1.4.7
    env_file:
      - ./.env
    container_name: bifrost
    ports:
      - "8080:8080"
    volumes:
      - bifrost-data:/app/data
      - ./bifrost/config.json:/app/data/config.json:ro
    environment:
      - BIFROST_LOG_LEVEL=info
      - POSTGRES_HOST=db
      - POSTGRES_DB=demo
      - POSTGRES_USER=demo
      - POSTGRES_PASSWORD=demo
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      limiter:
        condition: service_started

  limiter:
    cpu_shares: 1024
    build:
      context: .
      dockerfile: limiter/Dockerfile
    ports:
      - "8002:8002"
    environment:
      UPSTREAM_URL: http://llm-mock:8001
      REDIS_URL: redis://redis:6379
      RATE_LIMIT_RPM: "30"
      RATE_LIMIT_TPM: "10000"
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
  bifrost-data:
