services:
  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: demo
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo"]
      interval: 5s
      timeout: 5s
      retries: 5

  simulator:
    build: .
    command: sh -c "python manage.py migrate --no-input && python manage.py collectstatic --no-input && watchfiles --filter python 'daphne -b 0.0.0.0 -p 8000 config.asgi:application'"
    env_file:
      - .env
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DEBUG: "true"
      DATABASE_NAME: demo
      DATABASE_USER: demo
      DATABASE_PASSWORD: demo
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      REDIS_URL: redis://redis:6379
      OPENAI_BASE_URL: http://backend:8003/v1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      backend:
        condition: service_started

  backend:
    build: ./backend
    ports:
      - "8003:8003"
    volumes:
      - ./backend:/app
    environment:
      BIFROST_URL: http://bifrost:8080/v1
      REDIS_URL: redis://redis:6379
      RETRY_AFTER_CAP: "15"
    depends_on:
      bifrost:
        condition: service_started
      redis:
        condition: service_started

  bifrost:
    image: maximhq/bifrost
    entrypoint: ["/bin/sh", "/app/data/init.sh"]
    env_file:
      - ./.env
    container_name: bifrost
    ports:
      - "8080:8080"
    volumes:
      - bifrost-data:/app/data
      - ./bifrost/config.json:/app/data/config.json:ro
      - ./bifrost/init.sh:/app/data/init.sh:ro
    environment:
      - BIFROST_LOG_LEVEL=error
      - POSTGRES_HOST=db
      - POSTGRES_DB=demo
      - POSTGRES_USER=demo
      - POSTGRES_PASSWORD=demo
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      v_llm:
        condition: service_started

  v_llm:
    build:
      context: .
      dockerfile: vLLM/Dockerfile
    ports:
      - "8002:8002"
    environment:
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: 'error'
      RATE_LIMIT_RETRY_AFTER: "5"
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
  bifrost-data:
